name: Python DevSecOps Pipeline

# When does this pipeline run?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:

  # ========================================
  # STEP 1 — Run Unit Tests
  # ========================================

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest --cov=app --cov-report=term-missing


  # ========================================
  # STEP 2 — SAST (Find code security issues)
  # ========================================

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze code
        uses: github/codeql-action/analyze@v3


  # ========================================
  # STEP 3 — SCA (Check for vulnerable packages)
  # ========================================

  sca:
    name: SCA - Dependency Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run dependency scan
        run: |
          pip-audit

  # Secret Scan

  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # Build, scan, and publish the same image from one runner.
  build-scan-push:
    name: Build, Scan, and Push
    needs:
      - test
      - sast
      - sca
      - secret-scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --pull -t m0y0nk/devsecops-homework:${{ github.sha }} .

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan image
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 m0y0nk/devsecops-homework:${{ github.sha }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: m0y0nk
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image as latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag m0y0nk/devsecops-homework:${{ github.sha }} m0y0nk/devsecops-homework:latest

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push m0y0nk/devsecops-homework:${{ github.sha }}
          docker push m0y0nk/devsecops-homework:latest

  # ========================================
  # Deploy only after successful checks and image publication.
  # ========================================

  deploy:
    name: Deploy to Kubernetes
    needs:
      - build-scan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster (For testing deployment)
        uses: helm/kind-action@v1.10.0

      - name: Update deployment with new image tag
        run: |
          # Replace '__IMAGE_TAG__' placeholder with the specific git sha we just pushed
          sed -i "s|__IMAGE_TAG__|${{ github.sha }}|g" k8s/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Check rollout status
        run: |
          kubectl rollout status deployment/session17-python --timeout=120s
          kubectl get deployment session17-python
          kubectl get pods -l app=session17-python

      - name: Test running website in CI (Curl)
        run: |
          kubectl port-forward service/session17-python 5001:80 > /tmp/devsecops-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5001/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/devsecops-port-forward.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://localhost:5001/api/status